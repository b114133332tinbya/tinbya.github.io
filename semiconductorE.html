<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>W3 英文示範音檔</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --female-color: #db2777;
      --female-hover: #be185d;
      --male-color: #2563eb;
      --male-hover: #1d4ed8;
      --border: #e2e8f0;
      --active-border: #6366f1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 0.8rem 0.6rem 2.5rem;
      line-height: 1.5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 0.8rem;
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.2rem 0;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 0.8rem;
      margin: 0;
    }

    /* 頂部語速調整條：輕量化 */
    .controls-panel {
      background: var(--card-bg);
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    input[type="range"] {
      width: 110px;
      height: 4px;
    }

    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* 句子卡片：緊湊佈局 */
    .sentence-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      transition: border-color 0.2s;
    }

    .sentence-card.is-active {
      border-color: var(--active-border);
      background-color: #faf5ff;
    }

    .sentence-number {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--male-color);
      letter-spacing: 0.03em;
      margin-bottom: 0.15rem;
    }

    .sentence-text {
      font-size: 0.92rem;
      color: var(--text-main);
      margin: 0 0 0.55rem 0;
      line-height: 1.45;
    }

    /* 按鈕群組：小巧、橫向排列 */
    .btn-group {
      display: flex;
      gap: 0.45rem;
    }

    .audio-btn {
      flex: 1;
      max-width: 110px;
      border: none;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      color: white;
      touch-action: manipulation;
    }

    .female-btn {
      background: var(--female-color);
    }
    .female-btn:active {
      background: var(--female-hover);
    }

    .male-btn {
      background: var(--male-color);
    }
    .male-btn:active {
      background: var(--male-hover);
    }

    .audio-btn.playing {
      background: #475569 !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>W3 英文錄音示範</h1>
      <p class="subtitle">點擊即可在手機上快速試聽</p>
    </header>

    <div class="controls-panel">
      <div class="control-item">
        <label for="speedRange">語速：</label>
        <input type="range" id="speedRange" min="0.75" max="1.0" step="0.05" value="0.9" />
        <span id="speedValue" style="color: var(--text-sub); font-size: 0.8rem; width: 35px;">0.9x</span>
      </div>
    </div>

    <div class="sentence-list" id="sentenceList"></div>
  </div>

  <audio id="player" preload="none"></audio>

  <script>
    const sentences = [
      "These unprocessed silicon wafers are sometimes referred to as \"blank checks\" because they have no patterns before processing.",
      "Taiwan's TSMC is a globally recognized foundry specializing in processing these silicon wafers into high-performance, marketable chips.",
      "After the circuits are etched onto it, the silicon wafer can be sliced into dozens or even hundreds of individual units, known as \"dies.\"",
      "Once these dies undergo packaging and testing, they are transformed into the familiar black, rectangular chips we see in everyday products.",
      "Wafer processing is not only complex but also requires high precision and strict quality control, as each step is crucial to the performance and quality of the final chips.",
      "A chip, formally known as an integrated circuit (IC), is a semiconductor component that has been fully processed and manufactured.",
      "Inside a chip, there are integrated circuits and billions of tiny components, such as transistors, resistors, and capacitors, which allow it to perform specific functions like signal processing, logical operations, and data storage.",
      "Chips are widely used in various electronic products, including smartphones, household appliances, vehicles, and medical devices."
    ];

    const player = document.getElementById("player");
    const speedRange = document.getElementById("speedRange");
    const speedValue = document.getElementById("speedValue");
    const sentenceList = document.getElementById("sentenceList");

    let currentBtn = null;
    let currentCard = null;

    speedRange.addEventListener("input", (e) => {
      speedValue.textContent = `${e.target.value}x`;
      if (!player.paused) {
        player.playbackRate = parseFloat(e.target.value);
      }
    });

    function stopPlayback() {
      if (!player.paused) {
        player.pause();
      }
      if (currentBtn) {
        const isFemale = currentBtn.classList.contains("female-btn");
        currentBtn.textContent = isFemale ? "👩 女聲" : "👨 男聲";
        currentBtn.classList.remove("playing");
        currentBtn = null;
      }
      if (currentCard) {
        currentCard.classList.remove("is-active");
        currentCard = null;
      }
    }

    function playAudio(filePrefix, index, btn, card) {
      if (currentBtn === btn) {
        stopPlayback();
        return;
      }

      stopPlayback();

      currentBtn = btn;
      currentCard = card;
      btn.textContent = "⏹ 停止";
      btn.classList.add("playing");
      card.classList.add("is-active");

      const num = index + 1;
      player.playbackRate = parseFloat(speedRange.value);

      // 自動雙重嘗試：先嘗試 f1.mp3，若失敗自動嘗試 f1.mp3.mp3
      player.src = `${filePrefix}${num}.mp3`;
      
      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // 若失敗，自動嘗試 .mp3.mp3
          player.src = `${filePrefix}${num}.mp3.mp3`;
          player.play().catch(() => {
            alert(`找不到音檔「${filePrefix}${num}.mp3」，請確認音檔放在同資料夾`);
            stopPlayback();
          });
        });
      }

      player.onended = stopPlayback;
      player.onerror = () => {
        // 如果標準檔名出錯，嘗試後備檔名
        if (!player.src.endsWith(".mp3.mp3")) {
          player.src = `${filePrefix}${num}.mp3.mp3`;
          player.play().catch(stopPlayback);
        } else {
          stopPlayback();
        }
      };
    }

    sentences.forEach((sentence, index) => {
      const card = document.createElement("div");
      card.className = "sentence-card";

      const num = document.createElement("div");
      num.className = "sentence-number";
      num.textContent = `Sentence 0${index + 1}`;

      const p = document.createElement("p");
      p.className = "sentence-text";
      p.textContent = sentence;

      const btnGroup = document.createElement("div");
      btnGroup.className = "btn-group";

      const femaleBtn = document.createElement("button");
      femaleBtn.className = "audio-btn female-btn";
      femaleBtn.textContent = "👩 女聲";
      femaleBtn.onclick = () => playAudio("f", index, femaleBtn, card);

      const maleBtn = document.createElement("button");
      maleBtn.className = "audio-btn male-btn";
      maleBtn.textContent = "👨 男聲";
      maleBtn.onclick = () => playAudio("m", index, maleBtn, card);

      btnGroup.appendChild(femaleBtn);
      btnGroup.appendChild(maleBtn);

      card.appendChild(num);
      card.appendChild(p);
      card.appendChild(btnGroup);
      sentenceList.appendChild(card);
    });
  </script>
</body>
</html>
